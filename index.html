<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5e8de">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<title>Para ti</title>
<style>
  :root {
    color-scheme: only light;
    --bg: #f5e8de;
    --ink: #4a2f26;
    --ink-soft: #7a5a4c;
    --line: #2b2320;
    --font: "Segoe UI", "Helvetica Neue", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #f5e8de !important; background-color: #f5e8de !important; background-image: linear-gradient(#f5e8de, #f5e8de) !important; }
  body {
    font-family: var(--font);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 46dvh;
    flex: 0 0 auto;
  }
  .letter {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 14px 24px 8px;
  }
  #typed {
    white-space: pre-wrap;
    font-size: clamp(16px, 4.6vw, 20px);
    line-height: 1.45;
    max-width: 34ch;
  }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .counter {
    flex: 0 0 auto;
    padding: 10px 24px 18px;
  }
  .counter p {
    font-size: clamp(14px, 3.9vw, 17px);
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .counter .time {
    font-size: clamp(16px, 4.8vw, 21px);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .counter .time span { font-size: .78em; color: var(--ink-soft); }

  /* ===== Subtítulos tipo agua (capa flotante, no mueve nada del diseño) ===== */
  .fx {
    position: fixed; z-index: 10; left: 0; right: 0;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }
  .sub {
    max-width: min(88vw, 430px);
    padding: 11px 20px;
    border-radius: 26px 30px 24px 32px / 30px 24px 32px 26px;
    text-align: center;
    font-size: clamp(14px, 4vw, 17px);
    line-height: 1.35;
    color: #fffaf6;
    text-shadow: 0 1px 6px rgba(40,22,16,.7);
    background:
      radial-gradient(120% 140% at 15% 0%, rgba(255,255,255,.45), rgba(255,255,255,0) 45%),
      linear-gradient(135deg, rgba(122,78,62,.50), rgba(74,47,38,.38));
    -webkit-backdrop-filter: blur(12px) saturate(1.5);
    backdrop-filter: blur(12px) saturate(1.5);
    border: 1px solid rgba(255,255,255,.65);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.8), inset 0 -8px 16px rgba(255,255,255,.12), 0 10px 30px rgba(74,47,38,.18);
    opacity: 0; transform: translateY(6px) scale(.97);
    filter: blur(5px);
    transition: opacity .6s ease, transform .6s ease, filter .6s ease;
    animation: ripple 7s ease-in-out infinite;
  }
  .sub.on { opacity: 1; transform: none; filter: blur(0); }
  @keyframes ripple {
    0%, 100% { border-radius: 26px 30px 24px 32px / 30px 24px 32px 26px; }
    50%      { border-radius: 32px 24px 30px 26px / 24px 32px 26px 30px; }
  }
  .mbtn {
    pointer-events: auto; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; color: #fffaf6; font-size: 15px;
    background: linear-gradient(135deg, rgba(255,255,255,.32), rgba(255,255,255,.08));
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.6);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.8), 0 6px 18px rgba(74,47,38,.18);
    text-shadow: 0 1px 4px rgba(74,47,38,.5);
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  @media (prefers-reduced-motion: reduce) { .sub { animation: none; transition: opacity .2s; filter: none; } }
</style>
</head>
<body>

<canvas id="tree" aria-hidden="true"></canvas>

<section class="letter">
  <p id="typed" aria-live="polite"></p>
</section>

<footer class="counter">
  <p>Mi amor por ti comenzó hace...</p>
  <div class="time" id="time"></div>
</footer>

<div class="fx" aria-live="off">
  <div class="mbtn" id="mbtn" role="button" aria-label="Pausar o reproducir música">♪</div>
  <div class="sub" id="sub"></div>
</div>

<script>
/* ============ CONFIGURACIÓN: cambia esto ============ */
const START_DATE = new Date("2024-10-24T00:00:00"); // desde cuándo cuenta el contador
const LETTER = [
  "Para el amor de mi vida:",
  "",
  "Si pudiera elegir un lugar seguro, sería a tu lado.",
  "Cuanto más tiempo estoy contigo más te amo.",
  "Este texto es solo un ejemplo de demostración y no refleja sentimientos reales.",
  "",
  "                — Para el amor de mi vida"
].join("\n");
/* ===================================================== */

const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas = document.getElementById("tree");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* ---------- Corazones del follaje (coordenadas en espacio de corazón) ---------- */
const PALETTE = ["#ff3d7f", "#e8194f", "#ff6fa5", "#ffd23f", "#ffb02e", "#ff8a3d", "#f43f5e", "#ffe66d", "#d6336c", "#ff9ec4"];
const heartXY = t => [
  16 * Math.pow(Math.sin(t), 3),
  13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
];

const hearts = [];
const COUNT = 520;
for (let i = 0; i < COUNT; i++) {
  const t = Math.random() * Math.PI * 2;
  const r = 0.12 + 0.88 * Math.sqrt(Math.random());
  const [x, y] = heartXY(t);
  const hx = x * r, hy = y * r;
  hearts.push({
    x: hx, y: hy,
    size: 0.5 + Math.random() * 0.75,
    rot: (Math.random() - 0.5) * 1.4,
    color: PALETTE[(Math.random() * PALETTE.length) | 0],
    alpha: 0.82 + Math.random() * 0.18,
    // aparecen de abajo hacia arriba
    delay: ((hy + 17) / 29) * 2.4 + Math.random() * 0.8
  });
}
// ramas finas dentro de la copa
const branches = [[-0.55, 0.15], [0.55, 0.15], [-0.25, -0.45], [0.3, -0.5], [0, -0.1], [-0.75, -0.35], [0.75, -0.35]];

function drawHeart(x, y, s, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.beginPath();
  ctx.moveTo(0, s * 0.9);
  ctx.bezierCurveTo(-s * 1.5, -s * 0.1, -s * 0.9, -s * 1.1, 0, -s * 0.35);
  ctx.bezierCurveTo(s * 0.9, -s * 1.1, s * 1.5, -s * 0.1, 0, s * 0.9);
  ctx.fill();
  ctx.restore();
}
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeBack = p => { const c = 1.70158; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

/* ---------- Pétalos que caen ---------- */
const petals = [];
const pile = [];
const PILE_MAX = 380;
let lastSpawn = 0;

/* ---------- Escena ---------- */
const TRUNK_TIME = 2.0;      // s que tarda en crecer el tronco
const BLOOM_START = 1.6;     // s cuando empieza a brotar el follaje
const TYPE_START = 4.2;      // s cuando empieza a escribirse la carta
let t0 = null, prev = 0;

function frame(now) {
  if (t0 === null) { t0 = now; prev = now; }
  const t = reduce ? 99 : (now - t0) / 1000;
  const dt = Math.min((now - prev) / 1000, 0.05);
  prev = now;

  ctx.clearRect(0, 0, W, H);

  // geometría
  const groundY = H - 10;
  const cx = W / 2;
  const trunkH = H * 0.24;
  const availCrown = groundY - trunkH * 0.85 - 8;
  const k = Math.min((W * 0.47) / 16, availCrown / 29);
  const tipY = groundY - trunkH * 0.85;
  const cy = tipY - 17 * k;

  // suelo
  ctx.strokeStyle = "#2b2320";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(10, groundY);
  ctx.lineTo(W - 10, groundY);
  ctx.stroke();

  // tronco (crece desde el suelo)
  const g = easeOut(Math.min(t / TRUNK_TIME, 1));
  const h = trunkH * 1.15 * g;
  const wB = Math.max(W * 0.075, 16), wT = wB * 0.45;
  const w = wB + (wT - wB) * g;
  ctx.fillStyle = "#0e8a74";
  ctx.beginPath();
  ctx.moveTo(cx - wB / 2, groundY);
  ctx.quadraticCurveTo(cx - wB / 2 + 2, groundY - h * 0.5, cx - w / 2 + 3, groundY - h);
  ctx.lineTo(cx + w / 2 + 3, groundY - h);
  ctx.quadraticCurveTo(cx + wB / 2 + 2, groundY - h * 0.5, cx + wB / 2, groundY);
  ctx.closePath();
  ctx.fill();

  // ramas
  const bp = Math.min(Math.max((t - 1.2) / 1.4, 0), 1);
  if (bp > 0) {
    ctx.strokeStyle = "#0e8a74";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    const topY = groundY - trunkH * 1.15;
    branches.forEach(([u, v]) => {
      const ex = cx + u * 16 * k, ey = cy - v * 14 * k;
      const sx = cx + 3, sy = topY + 4;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.quadraticCurveTo(sx + (ex - sx) * 0.2, sy + (ey - sy) * 0.7, sx + (ex - sx) * bp, sy + (ey - sy) * bp);
      ctx.stroke();
    });
  }

  // follaje
  let bloomed = 0;
  for (const p of hearts) {
    const lt = (t - BLOOM_START - p.delay) / 0.7;
    if (lt <= 0) continue;
    if (lt >= 1) bloomed++;
    const sc = easeBack(Math.min(lt, 1));
    ctx.globalAlpha = p.alpha * Math.min(lt * 2, 1);
    ctx.fillStyle = p.color;
    drawHeart(cx + p.x * k, cy - p.y * k, p.size * k * 0.95 * sc, p.rot);
  }
  ctx.globalAlpha = 1;

  // pétalos que caen y se acumulan abajo
  if (bloomed > COUNT * 0.6 && t - lastSpawn > 0.07 && !reduce) {
    lastSpawn = t;
    for (let n = 0; n < 2; n++) {
      const p = hearts[(Math.random() * hearts.length) | 0];
      petals.push({
        x: cx + p.x * k, y: cy - p.y * k, vy: 26 + Math.random() * 34,
        vx: (Math.random() - 0.5) * 46,
        ph: Math.random() * 6, sway: 8 + Math.random() * 16,
        s: p.size * k * 0.9, rot: p.rot, vr: (Math.random() - 0.5) * 2.4, color: p.color
      });
    }
  }
  for (let i = petals.length - 1; i >= 0; i--) {
    const q = petals[i];
    q.y += q.vy * dt;
    q.x += q.vx * dt;
    q.ph += dt * 2;
    q.rot += q.vr * dt;
    const px = q.x + Math.sin(q.ph) * q.sway;
    if (q.y > groundY - q.s * 0.5) {
      const u = Math.min(Math.max((px - cx) / W, -0.47), 0.47);
      const mound = 4 + 16 * (1 - Math.abs(u) / 0.5);
      pile.push({ u, dy: q.s * 0.5 + Math.random() * mound, s: q.s, rot: q.rot, color: q.color });
      if (pile.length > PILE_MAX) pile.shift();
      petals.splice(i, 1);
      continue;
    }
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = q.color;
    drawHeart(px, q.y, q.s, q.rot);
  }
  // montón de corazones en el suelo
  for (const q of pile) {
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = q.color;
    drawHeart(cx + q.u * W, groundY - q.dy, q.s, q.rot);
  }
  ctx.globalAlpha = 1;

  // carta escrita a máquina
  typeStep(t);

  requestAnimationFrame(frame);
}

/* ---------- Máquina de escribir ---------- */
const typedEl = document.getElementById("typed");
let shown = -1;
function typeStep(t) {
  const n = reduce ? LETTER.length : Math.max(0, Math.min(LETTER.length, Math.floor((t - TYPE_START) / 0.055)));
  if (t < TYPE_START - 0.3 && !reduce) return;
  if (n === shown) return;
  shown = n;
  typedEl.innerHTML = "";
  typedEl.append(document.createTextNode(LETTER.slice(0, n)));
  const c = document.createElement("span");
  c.className = "cursor";
  c.textContent = "_";
  typedEl.append(c);
  const box = typedEl.parentElement;
  box.scrollTop = box.scrollHeight;
}

/* ---------- Contador ---------- */
const timeEl = document.getElementById("time");
const pad = n => String(n).padStart(2, "0");
function tick() {
  let s = Math.max(0, Math.floor((Date.now() - START_DATE.getTime()) / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400;
  const hh = Math.floor(s / 3600); s -= hh * 3600;
  const mm = Math.floor(s / 60); s -= mm * 60;
  timeEl.innerHTML =
    `${d} <span>días</span> ${pad(hh)} <span>horas</span> ${pad(mm)} <span>minutos</span> ${pad(s)} <span>segundos</span>`;
}
tick();
setInterval(tick, 1000);

if (reduce) {
  for (let i = 0; i < 200; i++) {
    const u = (Math.random() - 0.5) * 0.9;
    pile.push({ u, dy: 6 + Math.random() * (4 + 16 * (1 - Math.abs(u) / 0.5)), s: 5 + Math.random() * 6,
      rot: (Math.random() - 0.5) * 3, color: PALETTE[(Math.random() * PALETTE.length) | 0] });
  }
}
requestAnimationFrame(frame);

/* ---------- Música + subtítulos ---------- */
/* LETRA: pega tu arreglo `textos` aquí abajo (una línea de la canción por elemento, entre comillas).
   Los tiempos se reparten solos a lo largo de la canción según el largo de cada línea,
   así que no importa cuántas líneas pongas. Si lo dejas vacío se muestra una ♪. */
const textos = [
  "My love, will you",
  "Take my hand with virtue?",
  "For time has proved",
  "That I, do love you",
  "Will we ever find",
  "A way to make our time last forever?",
  "Because I begin to miss you",
  "One kiss from you",
  "And your touch will change",
  "My life and my blue",
  "As long as you stay",
  "Will we ever find",
  "A way to make our time last forever?",
  "Because I begin to miss you",
  "Will we ever find",
  "A way to make our time last forever?",
  "Because I begin to miss you"
];
const LYRICS = [
  { s: 0.3, e: 3.3, t: textos[0] },
  { s: 3.3, e: 6.3, t: textos[1] },
  { s: 6.3, e: 9.3, t: textos[2] },
  { s: 9.3, e: 12.3, t: textos[3] },
  { s: 12.3, e: 15.3, t: textos[4] },
  { s: 15.3, e: 18.3, t: textos[5] },
  { s: 18.3, e: 21.3, t: textos[6] },
  { s: 21.3, e: 24.3, t: textos[7] },
  { s: 24.3, e: 27.3, t: textos[8] },
  { s: 27.3, e: 30.3, t: textos[9] },
  { s: 30.3, e: 33.3, t: textos[10] },
  { s: 33.3, e: 36.3, t: textos[11] },
  { s: 36.3, e: 39.3, t: textos[12] },
  { s: 39.3, e: 42.3, t: textos[13] },
  { s: 42.3, e: 45.2, t: textos[14] },
  { s: 45.2, e: 48.2, t: textos[15] },
  { s: 48.2, e: 51.2, t: textos[16] }
];

const song = document.getElementById("song");
song.addEventListener("loadedmetadata", () => { if (isFinite(song.duration)) buildLyrics(song.duration); });
const subEl = document.getElementById("sub");
const mbtn = document.getElementById("mbtn");
let lastLine = -2;
function updateSub() {
  let idx = -1;
  if (song.paused) idx = -3;
  else {
    const ct = song.currentTime;
    idx = LYRICS.findIndex(l => ct >= l.s && ct < l.e);
  }
  if (idx !== lastLine) {
    lastLine = idx;
    if (idx === -1) subEl.classList.remove("on");
    else {
      subEl.classList.remove("on");
      setTimeout(() => {
        if (lastLine !== idx) return;
        subEl.textContent = idx === -3 ? "Toca la pantalla para escuchar ♪" : (LYRICS[idx].t.trim() || "♪");
        subEl.classList.add("on");
      }, 120);
    }
  }
  requestAnimationFrame(updateSub);
}
requestAnimationFrame(updateSub);
function syncBtn() { mbtn.textContent = song.paused ? "♪" : "❚❚"; mbtn.style.fontSize = song.paused ? "16px" : "11px"; }
song.addEventListener("play", syncBtn);
song.addEventListener("pause", syncBtn);
mbtn.addEventListener("click", e => { e.stopPropagation(); song.paused ? song.play().catch(()=>{}) : song.pause(); });
// Los navegadores bloquean el autoplay: se intenta al cargar y, si no, al primer toque.
let userPaused = false;
mbtn.addEventListener("click", () => { userPaused = song.paused; });
song.play().catch(() => {
  const go = e => { if (e && e.target === mbtn) return; if (!userPaused && song.paused) song.play().catch(()=>{}); };
  ["pointerdown", "touchend", "keydown"].forEach(ev => window.addEventListener(ev, go, { once: true }));
});
</script>
